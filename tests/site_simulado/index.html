<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>RHGestor (simulado)</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  .banner { float: left; width: 45%; height: 100vh; background: #2b6cb0; color: #fff; padding: 20px; box-sizing: border-box; }
  .login { margin-left: 50%; padding: 60px 20px; }
  .menu { float: left; width: 220px; background: #eee; min-height: 100vh; }
  .menu a { display: block; padding: 8px; cursor: pointer; }
  .menu ul { display: none; margin: 0; padding-left: 14px; }
  .menu ul.aberto { display: block; }
  #conteudo { margin-left: 230px; padding: 10px; }
  .topo { display: flex; justify-content: space-between; align-items: center; }
  .card-turma { display: inline-block; width: 230px; height: 90px; margin: 10px; padding: 8px; background: #e2e8f0; cursor: pointer; vertical-align: top; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.3); }
  .modal-content { background: #fff; margin: 30px auto; width: 900px; padding: 10px; max-height: 85vh; overflow: auto; }
  .confirmacao { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50; }
  .confirmacao > div { background: #fff; margin: 160px auto; width: 420px; padding: 16px; }
  #toast-container { position: fixed; top: 10px; right: 10px; z-index: 99; }
  .toast { background: #38a169; color: #fff; padding: 8px 12px; margin-bottom: 6px; }
  .toast-error { background: #c53030; }
  table { border-collapse: collapse; } td, th { border: 1px solid #ccc; padding: 4px; }
  .blockUI { position: fixed; inset: 0; background: rgba(255,255,255,.5); z-index: 40; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-container"></div>
<script>
// Imita as telas do RHGestor usadas pelo app (mesmos rótulos, botões e mensagens).
// localStorage 'tamPagina' muda o tamanho da página da lista de alunos (padrão: todos).
const LOGIN = 'gestor', SENHA = 'teste';
const TURMAS = [
  {id: 1, nome: 'Onboarding Bayer', inicio: '2025-03-01'},
  {id: 2, nome: 'Treinamentos Institucionais GAP SSMA', inicio: '2024-05-10'},
];
const COLABORADORES = [
  ['JOÃO DA SILVA PEREIRA', 'Técnico de Segurança', 'joao@gap.com', 'Matriz'],
  ['MARCOS PAULO SOUZA', 'Operador', 'marcos1@gap.com', 'Obra A'],
  ['MARCOS PAULO DE SOUZA', 'Ajudante', 'marcos2@gap.com', 'Obra B'],
  ['ANA PAULA ERRO TESTE', 'Auxiliar', '', 'Matriz'],
  ['BEATRIZ LIMA', 'Analista', 'bia@gap.com', 'Matriz'],
  ['BRUNO MATIAS DE OLIVEIRA', 'Motorista', 'bruno@gap.com', 'Obra A'],
  ['CARLA MENDES ROCHA', 'Engenheira', 'carla@gap.com', 'Obra C'],
  ['DANIEL ALVES', 'Eletricista', 'daniel@gap.com', 'Obra C'],
  ['EDUARDO NUNES', 'Pedreiro', 'edu@gap.com', 'Obra B'],
  ['FERNANDA COSTA', 'Administrativo', 'fe@gap.com', 'Matriz'],
];
const app = document.getElementById('app');
const norm = t => (t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const espera = ms => new Promise(r => setTimeout(r, ms));
const turmaAlunos = () => JSON.parse(localStorage.getItem('turma2') || '[]');
const caminho = location.pathname.toLowerCase();

function carregando(sim) {
  let b = document.querySelector('.blockUI');
  if (sim && !b) { b = document.createElement('div'); b.className = 'blockUI'; document.body.appendChild(b); }
  if (!sim && b) b.remove();
}
function toast(texto, erro) {
  const t = document.createElement('div');
  t.className = 'toast' + (erro ? ' toast-error' : '');
  t.innerHTML = `<div class="toast-message">${texto}</div>`;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 1500);
}
function menu() {
  return `<div class="menu">
    <a href="/Home">Início</a>
    <a id="mTed" onclick="document.getElementById('subTed').classList.toggle('aberto')"><i class="fa fa-graduation-cap"></i> Treinamentos (T&amp;D)</a>
    <ul id="subTed">
      <li><a href="/Ted/Gerenciador">Gerenciador de Treinamento</a></li>
      <li><a href="/TedCorporativo/Index">Universidade Corporativa</a></li>
      <li><a href="/Ted/Certificados">Certificados Disponíveis</a></li>
    </ul>
    <a href="/Ponto">Ponto</a>
  </div>`;
}

if (caminho.startsWith('/login') || caminho === '/') {
  app.innerHTML = `<div class="banner"><h1>Sólides RHGestor</h1><p>Banner de novidades</p></div>
    <div class="login"><form id="f">
      <label for="Login">Login</label><br><input id="Login" name="Login" type="text"><br><br>
      <label for="Senha">Senha</label><br><input id="Senha" name="Senha" type="password"><br><br>
      <button type="submit" class="btn btn-primary">Acessar</button>
      <div id="msg"></div>
    </form></div>`;
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    carregando(true); await espera(600); carregando(false);
    if (document.getElementById('Login').value === LOGIN && document.getElementById('Senha').value === SENHA) {
      localStorage.setItem('logado', '1'); location.href = '/Home';
    } else {
      document.getElementById('msg').innerHTML = '<div class="alert alert-danger">Usuário ou senha inválidos.</div>';
    }
  };
} else if (localStorage.getItem('logado') !== '1') {
  location.href = '/login';
} else if (caminho.startsWith('/tedcorporativo/index')) {
  app.innerHTML = menu() + `<div id="conteudo">
    <div class="topo"><span>Dashboard &gt; Universidade Corporativa</span>
      <div><button class="btn btn-primary" title="Nova turma" onclick="localStorage.setItem('erro','novaTurma')">+</button>
      <button class="btn" id="atualizar" data-original-title="Atualizar janela / pesquisar"><i class="fa fa-refresh"></i></button></div></div>
    <h4>Filtros</h4>
    <div class="row"><div class="col"><label>Busca por Turma</label><input placeholder="Digite o texto a ser pesquisado"></div>
      <div class="col"><label>Início da turma</label><span class="k-datepicker"><input id="dtInicio" data-role="datepicker" value="28-10-2025"></span></div>
      <div class="col"><label>Término da turma</label><input id="dtFim" value="28-10-2027"></div></div>
    <h3>Universidade Corporativa</h3><div id="cards"></div><div class="k-pager-info">Sem itens para exibir</div></div>`;
  const ymd = v => { const m = v.match(/^(\d{2})[-\/](\d{2})[-\/](\d{4})$/); return m ? `${m[3]}-${m[2]}-${m[1]}` : '9999-12-31'; };
  document.getElementById('atualizar').onclick = async () => {
    carregando(true); await espera(700); carregando(false);
    const de = ymd(document.getElementById('dtInicio').value);
    const lista = TURMAS.filter(t => t.inicio >= de);
    document.getElementById('cards').innerHTML = lista.map(t =>
      `<div class="card-turma"><div class="titulo" onclick="location.href='/TedCorporativo/Turma?id=${t.id}'">${t.nome}
         <a class="copiar" title="Duplicar turma" onclick="event.stopPropagation(); localStorage.setItem('erro','duplicou')">&#10697;</a></div>
         <small>${t.inicio}</small></div>`).join('');
    document.querySelector('.k-pager-info').textContent = lista.length ? `Exibindo itens 1 - ${lista.length} de ${lista.length}` : 'Sem itens para exibir';
  };
} else if (caminho.startsWith('/tedcorporativo/turma')) {
  const turma = TURMAS.find(t => String(t.id) === new URLSearchParams(location.search).get('id'));
  app.innerHTML = menu() + `<div id="conteudo">
    <div class="topo"><span>Turmas - Universidade Corporativa</span>
      <div><button onclick="localStorage.setItem('erro','gravar')">Gravar</button> <button>Cancelar</button></div></div>
    <h2>Turma - Universidade Corporativa</h2>
    <label>Turma</label> <input value="${turma.nome}">
    <div><a href="/TedCorporativo/PesquisaAlunos/?e=${turma.id}" class="btn-alunos"><i class="fa fa-plus"></i> Alunos</a>
         <a href="#">+ Cursos/Treinamentos</a></div>
    <table><thead><tr><th>#</th><th>Nome</th><th>% Concluído</th></tr></thead><tbody>${turmaAlunos().map((n, i) => `<tr><td>${i + 1}</td><td>${n}</td><td>0,00%</td></tr>`).join('')}</tbody></table>
    </div>`;
} else if (caminho.startsWith('/tedcorporativo/pesquisaalunos')) {
  app.innerHTML = menu() + `<div id="conteudo">
    <div class="topo"><span>Dashboard &gt; Treinamentos Institucionais GAP SSMA &gt; Pesquisar Alunos</span>
      <div><button id="pesq"><i class="fa fa-refresh"></i> Pesquisar</button>
      <button id="todos"><i class="fa fa-check"></i> Todos</button>
      <button id="adicionar"><i class="fa fa-plus"></i> Adicionar</button></div></div>
    <div class="panel"><h4>Filtros</h4>
      <div class="row"><div class="col"><label>Superior Imediato</label><select><option>Nenhum superior imediato selecionado</option></select></div>
      <div class="col"><label>Busca por Nome</label><input id="busca" placeholder="Digite nome a ser pesquisado"></div></div></div>
    <div class="panel"><h4>Pesquisar Alunos</h4><div class="k-grid">
      <div class="k-pager-info" id="contador"></div>
      <div class="k-grid-header"><table><thead><tr><th></th><th>Colaborador</th><th>Lotação</th><th>Admissão</th></tr></thead></table></div>
      <div class="k-grid-content"><table><tbody id="linhas"></tbody></table></div></div></div></div>`;
  document.getElementById('pesq').onclick = async () => {
    busca = document.getElementById('busca').value;
    carregando(true); await espera(500); carregando(false);
    lista();  // recria a lista: as marcações somem (o pior caso)
  };
  document.getElementById('todos').onclick = () => localStorage.setItem('erro', 'todos');
  document.getElementById('adicionar').onclick = adicionar;
  lista();
} else if (caminho.startsWith('/trackco')) {
  // conteúdo do iframe da pesquisa de avaliação (Track.co)
  app.innerHTML = `<div style="position:relative;padding:20px"><button id="x" style="position:absolute;top:4px;right:4px">x</button>
    <p>LEONARDO, tudo bem?</p><p>Em uma escala de 0 a 10, o quanto você recomendaria a RHGestor by Sólides?</p>
    ${[...Array(11).keys()].map(n => `<button>${n}</button>`).join(' ')}<p>TRACK.CO</p></div>`;
  document.getElementById('x').onclick = () => parent.postMessage('fecharPesquisa', '*');
} else {
  app.innerHTML = menu() + '<div id="conteudo"><h2>Bem-vindo</h2></div>';
}
if (caminho.startsWith('/home') && !sessionStorage.getItem('pesquisaMostrada')) {
  sessionStorage.setItem('pesquisaMostrada', '1');
  setTimeout(() => {
    const f = document.createElement('div');
    f.id = 'trackco-widget';
    f.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:60';
    f.innerHTML = '<iframe src="/trackco/survey" title="Pesquisa" style="background:#fff;width:600px;height:300px;margin:120px auto;display:block;border:0"></iframe>';
    document.body.appendChild(f);
    window.addEventListener('message', e => {
      if (e.data === 'fecharPesquisa') { f.remove(); localStorage.setItem('pesquisaFechada', '1'); }
    });
  }, 1500);
}

var busca = '';
function lista() {
  const tam = +(localStorage.getItem('tamPagina') || 1000);
  const disponiveis = COLABORADORES.filter(c => !turmaAlunos().includes(c[0]))
    .filter(c => !busca || norm(c[0]).includes(norm(busca)));
  const pagina = disponiveis.slice(0, tam);
  document.getElementById('linhas').innerHTML = pagina.map(c => `<tr>
      <td><input type="checkbox" class="k-checkbox" value="${c[0]}"></td>
      <td><img alt=""><div><b>${c[0]}</b><br>${c[1]}<br>(13) 99999-0000<br>${c[2]}</div></td>
      <td>GAP GESTAO AMBIENTAL E PROJETOS LTDA<br>${c[3]}</td><td>Admissão: 01/01/2025<br>Regime: CLT</td></tr>`).join('');
  document.getElementById('contador').textContent = pagina.length
    ? `Exibindo itens 1 - ${pagina.length} de ${disponiveis.length}` : 'Sem itens para exibir';
}
function modal(html) {
  const m = document.createElement('div');
  m.className = 'modal fade show'; m.style.display = 'block';
  m.innerHTML = `<div class="modal-dialog"><div class="modal-content">${html}</div></div>`;
  document.body.appendChild(m);
  return m;
}
function adicionar() {
  const marcados = [...document.querySelectorAll('#linhas input:checked')].map(c => c.value);
  if (!marcados.length) { toast('Selecione ao menos um aluno.', true); return; }
  const c = modal(`<div class="modal-body"><p>Você confirma adicionar todos os alunos selecionados?</p></div>
    <div class="modal-footer"><button id="confirmar">Confirmar</button> <button id="fecharConf">Fechar</button></div>`);
  document.getElementById('fecharConf').onclick = () => c.remove();
  document.getElementById('confirmar').onclick = async () => {
    c.remove();
    const p = modal(`<div class="modal-header"><h5>Aguarde, adicionando alunos</h5></div>
      <div class="modal-body"><div id="rotulo">Processando</div><div id="progresso">0 de ${marcados.length}</div></div>
      <div class="modal-footer"><button id="fecharProc">Fechar</button></div>`);
    let ok = 0;
    for (const nome of marcados) {
      await espera(400);
      if (nome.includes('ERRO')) toast(`Erro ao adicionar ${nome}: aluno sem e-mail cadastrado.`, true);
      else { ok++; localStorage.setItem('turma2', JSON.stringify([...turmaAlunos(), nome])); toast(`${nome} adicionado!`); }
      document.getElementById('progresso').textContent = `${ok} de ${marcados.length}`;
    }
    document.getElementById('rotulo').textContent = 'Processamento concluído';
    document.getElementById('fecharProc').onclick = () => { p.remove(); lista(); };
  };
}
</script>
</body>
</html>
